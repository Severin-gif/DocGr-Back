name: DocGrid standalone backend
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: docgrid
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: docgrid_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer poppler-utils util-linux python3 python3-xlrd python3-openpyxl python3-lxml antiword python3-pil fonts-dejavu-core tesseract-ocr tesseract-ocr-rus tesseract-ocr-eng
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run test:postgres
        env:
          DATABASE_URL: postgresql://docgrid:test-password@127.0.0.1:5432/docgrid_test?schema=docgrid
      - run: docker build -t docgrid-back:ci .
      - name: Check image without database
        run: |
          docker run -d --name dg-ci -p 127.0.0.1:3400:4000 -e DOCGRID_IDENTITY_JWT_SECRET=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa -e DOCGRID_SERVICE_TOKEN=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb docgrid-back:ci
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:3400/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3400/health)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3400/ready)" = 503
          test "$(docker exec dg-ci id -u)" != 0
      - if: always()
        run: docker logs dg-ci 2>&1 || true
