name: DocGrid experiment preflight
on:
  pull_request:
    paths:
      - 'experiments/dg-exp-001/**'
      - '.github/workflows/docgrid-experiment-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Synthetic tests only; no live account or model
        run: node --test experiments/dg-exp-001/preflight.test.mjs
